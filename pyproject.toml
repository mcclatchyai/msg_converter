[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msg-converter"                 # distribution name (can have hyphen)
version = "0.1.0"
description = "Convert .msg emails to PDF, EML, MBOX, and CSV"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "McClatchy AI", email = "ai@mcclatchy.com" }]
license = { text = "MIT" }

# Keep deps minimal; we’ll expand later as needed
dependencies = [
  "weasyprint>=62",
  "beautifulsoup4>=4.12",
  "lxml>=5.1",
  "python-magic>=0.4.27",
  "html5lib>=1.1",
  "chardet>=5.2",
]

[project.urls]
Homepage = "https://github.com/mcclatchyai/msg_converter"
Issues = "https://github.com/mcclatchyai/msg_converter/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
